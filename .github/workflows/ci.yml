name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Daily, for the content job: a repo that skips its own guard job, or pushes past it,
  # still shows up here within a day.
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # A scheduled run on main must not cancel a push run on main, or the reverse.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  presets:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Node 24, because Renovate 44 runs on nothing older. npx installs the newest Renovate
      # whose `engines` accept the Node it runs under. Under Node 22 that was 42.99.0 on
      # 2026-10-10, two majors behind the hosted app, and the validator below ran on it.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      # Deliberately unpinned. The validator's job is to reject config the bot will reject,
      # so it should track whatever Renovate the hosted Mend app is running rather than a
      # version frozen here. `managerFilePatterns` replacing `fileMatch` in Renovate 41 is
      # the kind of change this catches early.
      - name: Validate the presets
        run: npx --yes --package renovate renovate-config-validator --strict default.json automerge.json

      # The validator accepts a rule that matches nothing, so it stays green when an edit
      # turns digest updates for actions back on, or stops the beliq-eu/.github pin. The
      # next four steps run Renovate itself over the workflows in test/action-pins and
      # check those two things in what it would open. README.md, "Checking the Renovate
      # rules", says what is read and what is not.
      - name: Test the check on the Actions pin rules
        run: node --test scripts/check-action-pin-rules.test.mjs

      - name: Build a repo from the Actions pin fixture
        run: node scripts/check-action-pin-rules.mjs build "$RUNNER_TEMP/action-pins"

      # Unpinned like the validator. `--platform=local` reads the directory and writes
      # nothing. Without a token Renovate does not look up the tags of an action on
      # github.com. The log stays on the runner: at trace level it is over 100 MB.
      - name: Dry-run Renovate over it
        working-directory: ${{ runner.temp }}/action-pins
        env:
          LOG_LEVEL: trace
          LOG_FORMAT: json
          GITHUB_COM_TOKEN: ${{ github.token }}
        run: >-
          npx --yes --package renovate renovate --platform=local
          --enabled-managers=github-actions > "$RUNNER_TEMP/renovate-dry-run.ndjson"

      # Runs after a failed dry run too: Renovate exits 1 when it logged an error, its
      # output went to the file, and this step prints the warnings and errors from it.
      - name: No digest update for an action, and the guard pin still moves
        if: ${{ !cancelled() }}
        run: node scripts/check-action-pin-rules.mjs judge "$RUNNER_TEMP/renovate-dry-run.ndjson"

      # The validator only reads this repo, so it cannot tell a working custom manager from
      # one whose file pattern matches nothing in any consuming repo. That gap is why the
      # `npm install -g npm@12.0.2` pin sat unread from 2026-09-19 to 2026-09-22.
      - name: Clone the repos these presets apply to
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate '/users/beliq-eu/repos?per_page=100' \
            --jq '.[] | select(.archived | not) | .name' | grep -vx '.github' > consumers.txt
          test -s consumers.txt
          mkdir -p consumers
          while read -r repo; do
            git clone --depth 1 --quiet "https://github.com/beliq-eu/$repo.git" "consumers/$repo"
          done < consumers.txt
          echo "cloned $(wc -l < consumers.txt) repositories"

      - name: Every marker comment is read, every npm pin carries one
        run: node scripts/check-custom-managers.mjs consumers/*

  # The content checks over every repo this account owns, read from this commit. A repo's own
  # guard job reads them at the commit it pins, so this is also where a repo that has not yet
  # taken a change to the checks or the shared files shows up.
  content:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'

      - name: Test the checks
        run: >-
          node --test scripts/check-public-scrub.test.mjs scripts/check-hidden-text.test.mjs
          scripts/check-session-paths.test.mjs

      # Includes one case against the real npm, PyPI and Packagist, to prove the answers
      # still have the shape the check reads.
      - name: Test the new-dependency check
        if: ${{ !cancelled() }}
        env:
          GUARD_LIVE_REGISTRIES: '1'
        run: python3 scripts/check-new-dependencies.test.py

      # Forks are left out: their content is upstream's, not ours. This step and the next
      # run even when the tests fail, so a red test cannot hide a finding in another repo.
      - name: Clone every repo this account owns
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate '/users/beliq-eu/repos?per_page=100' \
            --jq '.[] | select((.archived or .fork) | not) | .name' | grep -vx '.github' > own.txt
          test -s own.txt
          mkdir -p own
          while read -r repo; do
            git clone --depth 1 --quiet "https://github.com/beliq-eu/$repo.git" "own/$repo"
          done < own.txt
          echo "cloned $(wc -l < own.txt) repositories"

      - name: No internal file, local path or private link in any of them
        if: ${{ !cancelled() }}
        run: node scripts/check-public-scrub.mjs . own/*

      - name: No hidden bidi, zero-width or tag character in any of them
        if: ${{ !cancelled() }}
        run: node scripts/check-hidden-text.mjs . own/*

      - name: No path to a Claude Code plan or session transcript in any of them
        if: ${{ !cancelled() }}
        run: node scripts/check-session-paths.mjs . own/*

  # Proves the workflow other repos call, on this repo, before any of them pins it.
  guard:
    uses: ./.github/workflows/guard.yml
